<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>試験時間割 ・ 武藤模試</title>
<link rel="stylesheet" href="/styles/theme.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Outfit","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #app-shell-bar{position:fixed;top:0;left:0;right:0;z-index:100}
  #page{padding:62px 16px 30px;max-width:720px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:10px 8px;border-bottom:1px solid rgba(128,128,128,.3);text-align:left}
  th{font-size:12px;color:var(--muted)}
  tr.past{opacity:.45}
  tr.next td{font-weight:700}
  td a{color:inherit;text-decoration:none}
  td a:hover{text-decoration:underline}
  .mo{font-size:12px;color:#8ec5ff;font-weight:400;white-space:nowrap}
  .left{font-size:12px;color:var(--muted);font-weight:400}
</style>
</head>
<body>
<div id="app-shell-bar"></div>
<div id="page">
  <h1>後期中間試験 時間割</h1>
  <p class="sub">時限は分かり次第追記。未発表は発表され次第追加。</p>
  <table><thead><tr><th>日付</th><th>科目</th><th>時限</th><th>残り</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/app-shell.js"></script>
<script>
try { appShell.mount(document.getElementById('app-shell-bar'), { nav: window.APP_NAV }); } catch (e) { console.warn(e); }
// 4つ目は模試(ロードマップ)へのリンク。無い教科は null(模試はまだ作っていない)
var EXAMS = [
  ['2026-11-30', 'ロボティクス', '要確認', '/roadmap.html?d=roadmaps/robotics-2026-kouki-chukan.json'],
  ['2026-12-02', '制御工学Ⅱ', '要確認', null],
  ['2026-12-04', '科学技術英語Ⅱ', '要確認', null],
  ['2026-12-11', '情報ネットワーク工学', '要確認', '/roadmap.html?d=roadmaps/network-2026-kouki-chukan.json'],
  ['2026-12-14', '材料力学演習', '3限', null],
  ['2026-12-17', '熱流体工学Ⅱ', '要確認', null],
  [null, '第二外国語', '未発表', null],
  [null, 'プログラミング応用', '未発表', null]
];
var W = ['日','月','火','水','木','金','土'];
var now = new Date(); now.setHours(0,0,0,0);
var nextDone = false, html = '';
EXAMS.forEach(function (e) {
  var d = e[0] ? new Date(e[0] + 'T00:00:00') : null, cls = '', date = '未発表', left = '';
  if (d) {
    var n = Math.round((d - now) / 864e5);
    date = (d.getMonth() + 1) + '/' + d.getDate() + '(' + W[d.getDay()] + ')';
    if (n < 0) { cls = 'past'; left = '終了'; }
    else { left = n === 0 ? '今日' : 'あと' + n + '日'; if (!nextDone) { cls = 'next'; nextDone = true; } }
  }
  var subj = e[3] ? '<a href="' + e[3] + '">' + e[1] + ' <span class="mo">模試 ›</span></a>' : e[1];
  html += '<tr class="' + cls + '"><td>' + date + '</td><td>' + subj + '</td><td>' + e[2] + '</td><td class="left">' + left + '</td></tr>';
});
document.getElementById('rows').innerHTML = html;
</script>
</body>
</html>
