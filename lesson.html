<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学習ページ ・ 武藤模試</title>
<link rel="stylesheet" href="/styles/theme.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Outfit","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #app-shell-bar{position:fixed;top:0;left:0;right:0;z-index:100}
  #ls-page{padding-top:46px;min-height:100vh;background:var(--bg)}
</style>
</head>
<body>
<div id="app-shell-bar"></div>
<div id="ls-page"><div id="app" style="padding:30px 16px;color:var(--muted)">読み込み中...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/app-shell.js"></script>
<script src="/js/util.js"></script>
<script src="/js/lesson-engine.js"></script>
<script>
try { appShell.mount(document.getElementById('app-shell-bar'), { nav: window.APP_NAV }); } catch (e) { console.warn(e); }
(function () {
  var app = document.getElementById('app');
  var d = new URLSearchParams(location.search).get('d');
  if (!d) { app.textContent = 'エラー: ?d= パラメータが必要です（例: /lesson.html?d=lessons/xxx/data.json）'; return; }
  fetch('/' + d.replace(/^\/+/, ''))
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) { window.initLesson(data); })
    .catch(function (e) { app.textContent = 'データ読み込みエラー: ' + e.message; });
})();
</script>
</body>
</html>
